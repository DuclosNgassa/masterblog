<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Blog Post</title>
</head>
<body>
    <h1>Update Blog Post</h1>

    <form action="{{ url_for('update', post_id=post['id']) }}" method="POST">
    <h2>Add a new Post to your blog</h2>
    <br/>
    <label for="title">Title:</label><br>
    <input type="text" id="title" name="title" value="{{ post.title }}" required>
    <br/>
    <label for="content">Text:</label><br>
    <input type="text" id="content" name="content" value="{{ post.content }}" required>
    <br/>
    <label for="author">Name:</label><br>
    <input type="text" id="author" name="author" value="{{ post.author }}" required>
    <br/>
    <input type="submit" value="Update">
</form>
</body>
